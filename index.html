
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чекер</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #0b1120;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 430px;
  margin: 40px auto;
  padding: 25px;
  background: #172338;
  border-radius: 20px;
  text-align: center;
}

h1 {
  color: #38bdf8;
  font-size: 34px;
}

.device {
  background: #26364e;
  padding: 20px;
  border-radius: 14px;
  margin: 20px 0;
}

.status {
  color: #fbbf24;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

.lock { background: #dc3545; }
.unlock { background: #16a34a; }

button:active {
  opacity: .75;
}

small {
  color: #aab8cc;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="container">

  <h1>🔐 ЧЕКЕР</h1>
  <p>Удалённое управление устройством</p>

  <div class="device">
    <h2>📱 HONOR 9S</h2>
    <p>Пульт управления</p>
  </div>

  <div class="device">
    <h2>📱 Realme C35</h2>
    <p class="status" id="status">
      ● Не подключён
    </p>

    <button class="lock" onclick="showMessage('Блокировка пока не подключена. Требуется Android-приложение.')">
      🔒 Заблокировать
    </button>

    <button class="unlock" onclick="showMessage('Разблокировка пока не подключена. Требуется Android-приложение.')">
      🔓 Разблокировать
    </button>
  </div>

  <small>
    Чекер v1.0<br>
    Защищённая панель управления
  </small>

</div>

<script>
function showMessage(message) {
  alert(message);
}
</script>

</body>
</html>
